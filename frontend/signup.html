<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create an account for Patient Records Management System" />
    <title>Sign Up — Patient Records</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body class="centered">
    <div class="auth-container" style="max-width:460px;">
        <div class="card">
            <h1 class="card-title">Create Account</h1>
            <p class="card-subtitle" id="signupSubtitle">Verify your ID to get started</p>

            <div class="form-group">
                <label for="roleSelector">I am a:</label>
                <select id="roleSelector" class="full-width" style="padding: 0.8rem; border-radius: 8px; border: 1px solid #ddd;">
                    <option value="doctor">Doctor</option>
                    <option value="receptionist">Hospital Receptionist</option>
                </select>
            </div>

            <form id="signupForm" novalidate>
                
                <div id="nmcSection">
                    <div class="form-group">
                        <label for="nmcId">Medical Commission (NMC) ID <span class="required-star">*</span></label>
                        <input type="text" id="nmcId" placeholder="e.g. NMC12345" required />
                    </div>
                    <button type="button" class="btn btn-secondary full-width" id="verifyNmcBtn" style="background-color: #6c757d; color: white; margin-bottom: 1rem;">Verify Professional ID</button>
                </div>

                <div id="formDetails" style="display:none;">
                    <div class="form-group" style="text-align:center;margin-bottom:1.5rem;">
                        <div class="profile-upload" id="profileUpload">
                            <img id="profilePreviewImg" src="" alt="Profile" class="profile-preview-img" style="display:none;" />
                            <span class="profile-upload-placeholder" id="profilePlaceholder">📷</span>
                            <input type="file" id="profilePhoto" accept="image/*" />
                        </div>
                        <p style="font-size:0.75rem;color:var(--text-muted);margin-top:0.5rem;">Upload profile photo</p>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstName">First Name <span class="required-star">*</span></label>
                            <input type="text" id="firstName" placeholder="John" required />
                        </div>
                        <div class="form-group">
                            <label for="lastName">Last Name <span class="required-star">*</span></label>
                            <input type="text" id="lastName" placeholder="Doe" required />
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Email <span class="required-star">*</span></label>
                        <input type="email" id="email" placeholder="you@example.com" required />
                    </div>

                    <div class="form-group">
                        <label for="password">Password <span class="required-star">*</span></label>
                        <input type="password" id="password" placeholder="Create a password" required />
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password <span class="required-star">*</span></label>
                        <input type="password" id="confirmPassword" placeholder="Confirm your password" required />
                    </div>

                    <button type="submit" class="btn btn-primary full-width" id="signupBtn">Create Account</button>
                </div>
            </form>

            <p class="auth-link">
                Already have an account? <a href="index.html">Sign in</a>
            </p>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/signup.js"></script>
</body>
</html>
