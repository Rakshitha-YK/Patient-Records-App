<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Login to Patient Records Management System" />
    <title>Login — Patient Records</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body class="centered">
    <div class="auth-container">
        <div class="card">
            <h1 class="card-title">Patient Records</h1>
            <p class="card-subtitle">Sign in to your account</p>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@example.com" required />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required />
                </div>

                <button type="submit" class="btn btn-primary full-width" id="loginBtn">Sign In</button>
            </form>

            <p class="auth-link">
                Don't have an account? <a href="signup.html">Sign up</a>
            </p>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
