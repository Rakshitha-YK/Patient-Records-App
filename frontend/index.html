<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Login to Patient Records Management System" />
    <title>Login — Patient Records</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body class="centered">
    <div class="auth-container">
        <div class="card">
            <h1 class="card-title">Trustworthy</h1>
            <p class="card-subtitle">Sign in with your System ID</p>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="uniqueId">Unique ID</label>
                    <input type="text" id="uniqueId" placeholder="e.g. ADM101, DOC505" required />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required />
                </div>

                <button type="submit" class="btn btn-primary full-width" id="loginBtn">Sign In</button>
            </form>

            <p class="auth-note" style="margin-top: 20px; font-size: 0.85rem; color: #666; text-align: center;">
                Forgot your ID? Contact your system administrator.
            </p>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
