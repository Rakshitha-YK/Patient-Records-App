<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard | Trustworthy</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .stat-card { background: white; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; }
        .patient-table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .patient-table th, .patient-table td { padding: 1rem; text-align: left; border-bottom: 1px solid #eee; }
        .patient-table th { background-color: #f8f9fa; color: #666; font-weight: 600; }
        .badge { padding: 0.4rem 0.8rem; border-radius: 20px; font-size: 0.85rem; font-weight: 500; }
        .badge-info { background: #e7f3ff; color: #007bff; }
    </style>
</head>
<body style="background-color: #f4f7f6; padding: 2rem;">

    <div class="container" style="max-width: 1100px; margin: 0 auto;">
        <header class="dashboard-header">
            <div>
                <h1 id="welcomeText">Welcome, Doctor</h1>
                <p style="color: #666;">Here are your assigned clinical visits for today.</p>
            </div>
            <button onclick="logout()" class="btn btn-secondary" style="background-color: #ff4757; color: white; border: none;">Logout</button>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <h3 style="color: #666; font-size: 0.9rem;">Total Assigned</h3>
                <p id="totalCount" style="font-size: 2rem; font-weight: 700; color: #2f3542;">0</p>
            </div>
            <div class="stat-card">
                <h3 style="color: #666; font-size: 0.9rem;">Role Access</h3>
                <p class="badge badge-info">Verified Doctor</p>
            </div>
        </div>

        <div class="card" style="padding: 0;">
            <table class="patient-table">
                <thead>
                    <tr>
                        <th>Patient Name</th>
                        <th>DOB</th>
                        <th>Gender</th>
                        <th>Reason for Visit</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="patientList">
                    <tr>
                        <td colspan="5" style="text-align:center; padding: 2rem; color: #999;">Loading your patients...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        const API_BASE = 'http://localhost:5000/api';

        $(document).ready(function() {
            // 1. SECURITY CHECK: Ensure user is a Doctor
            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('currentUser'));

            if (!token || user.role !== 'doctor') {
                window.location.href = 'index.html';
                return;
            }

            $('#welcomeText').text(`Welcome, Dr. ${user.firstName}`);

            // 2. FETCH ASSIGNED PATIENTS
            $.ajax({
                url: API_BASE + '/patients',
                type: 'GET',
                headers: { 'Authorization': 'Bearer ' + token },
                success: function(response) {
                    const patients = response.patients;
                    $('#totalCount').text(patients.length);
                    
                    let html = '';
                    if (patients.length === 0) {
                        html = '<tr><td colspan="5" style="text-align:center; padding: 2rem;">No patients assigned to you yet.</td></tr>';
                    } else {
                        patients.forEach(p => {
                            html += `
                                <tr>
                                    <td><strong>${p.legalName}</strong></td>
                                    <td>${p.dob}</td>
                                    <td>${p.gender}</td>
                                    <td><span style="color: #666;">${p.reasonForVisit || 'N/A'}</span></td>
                                    <td>
                                        <button class="btn btn-primary" style="padding: 0.5rem 1rem; font-size: 0.8rem;" onclick="viewDetails(${p.id})">View Records</button>
                                    </td>
                                </tr>
                            `;
                        });
                    }
                    $('#patientList').html(html);
                },
                error: function() {
                    $('#patientList').html('<tr><td colspan="5" style="text-align:center; color: red;">Failed to load data.</td></tr>');
                }
            });
        });

        function viewDetails(id) {
            // Future logic to open clinical notes
            alert('Opening clinical records for Patient ID: ' + id);
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
